# @local/dsh-supply-chain-switch bundle patch
# 提供 /supply-chain 命令，可在 DSH 的 supply-chain 策略（minimumReleaseAge）之间切换：
#   - on  : minimumReleaseAge=0 + minimumReleaseAgeStrict=false → 允许刚发布的 npm 包
#   - off : minimumReleaseAge=1440 + minimumReleaseAgeStrict=true → 恢复 DSH 默认 24h 策略
#
# 插件会写入 C:\Users\dph\.dsh\profiles\desktop\pnpm-workspace.yaml 的
# minimumReleaseAge / minimumReleaseAgeStrict 两个 key，pnpm 安装时读取此配置。
#
# 插件本身不接管 web 搜索，仅注册两个命令。
- insert:
  - id: supply-chain-switch
    name: '@local/dsh-supply-chain-switch'
    config:
      # 默认策略（off）：1440 分钟（24h）+ strict
      minimumReleaseAge: 1440
      minimumReleaseAgeStrict: true
